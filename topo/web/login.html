<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · NetSec-Agentic Autonomous Security Operations Platform</title>
<style>
  :root{--bg:#070b14;--line:#22304a;--ink:#e6ebf5;--muted:#8b97ad;--orange:#FA582D;--ai:#8b5cf6;--ai2:#22d3ee}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Arial,"Microsoft YaHei",sans-serif;overflow:hidden}
  body{background:radial-gradient(900px 600px at 50% 42%,rgba(139,92,246,.16),transparent 65%),
                  radial-gradient(700px 500px at 18% 85%,rgba(250,88,45,.09),transparent 60%),
                  radial-gradient(circle at 1px 1px,#162135 1px,transparent 0) 0 0/26px 26px,var(--bg)}
  /* animated network backdrop */
  svg.net{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
  svg.net line{stroke:#2a3a57;stroke-width:1.2}
  svg.net line.flow{stroke:url(#flow);stroke-width:1.6;stroke-dasharray:10 14;animation:flow 3.2s linear infinite}
  svg.net circle{fill:#0d1526;stroke:#3b4d70;stroke-width:1.5}
  svg.net circle.hub{stroke:var(--orange);fill:rgba(250,88,45,.12)}
  svg.net circle.pulse{fill:none;stroke:var(--ai2);stroke-width:1.2;animation:pulse 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes flow{to{stroke-dashoffset:-48}}
  @keyframes pulse{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}

  main{position:relative;z-index:2;height:100%;display:grid;place-items:center;padding:24px}
  .card{width:min(440px,100%);padding:34px 34px 26px;border-radius:20px;position:relative;
    background:linear-gradient(180deg,rgba(18,26,44,.88),rgba(11,17,30,.92));backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.07);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(139,92,246,.12)}
  .card::before{content:"";position:absolute;inset:-1px;border-radius:21px;padding:1px;pointer-events:none;
    background:linear-gradient(120deg,var(--orange),var(--ai),var(--ai2),var(--orange));background-size:300% 300%;animation:edge 9s linear infinite;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.75}
  @keyframes edge{to{background-position:300% 0}}
  .mark{width:58px;height:58px;border-radius:16px;margin:0 auto 18px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--orange),var(--ai));box-shadow:0 0 34px rgba(139,92,246,.5)}
  .mark svg{width:32px;height:32px}
  h1{margin:0;text-align:center;line-height:1.15}
  h1 .name{display:block;font-size:30px;font-weight:800;letter-spacing:.3px;
    background:linear-gradient(100deg,#fff 0%,#ffd2c2 40%,#c4b5fd 75%,#67e8f9 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 .sub{display:block;margin-top:7px;font-size:14px;font-weight:600;color:#c3cbda;letter-spacing:.4px}
  .chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:16px 0 24px}
  .chips span{font-size:11px;color:#a5b4cc;padding:3px 9px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
  .chips span::before{content:"● ";color:var(--ai2);font-size:9px;vertical-align:1px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px;margin:0 0 6px}
  .field{position:relative;margin-bottom:14px}
  .field svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#6b7a95}
  input{width:100%;padding:12px 40px 12px 38px;border-radius:11px;border:1px solid #2c3a58;background:#0a101c;color:var(--ink);
    font:14px inherit;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--ai);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#6b7a95;cursor:pointer;padding:6px;font-size:13px}
  .eye:hover{color:#fff}
  button.go{width:100%;margin-top:6px;padding:13px;border:none;border-radius:11px;cursor:pointer;font:700 14.5px inherit;font-family:inherit;color:#fff;letter-spacing:.3px;
    background:linear-gradient(135deg,var(--ai),var(--ai2));box-shadow:0 8px 24px rgba(34,211,238,.25);transition:filter .15s,transform .1s}
  button.go:hover{filter:brightness(1.08)} button.go:active{transform:translateY(1px)}
  button.go:disabled{opacity:.6;cursor:wait}
  .err{min-height:20px;margin:10px 0 0;font-size:12.5px;color:#fb7185;text-align:center}
  .foot{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);text-align:center;font-size:11px;color:#5f6d86;line-height:1.6}
  .foot b{color:#8b97ad;font-weight:600}
  .shake{animation:shake .35s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>
<body>
<svg class="net" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><linearGradient id="flow" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
  <line x1="800" y1="450" x2="260" y2="250"/><line class="flow" x1="800" y1="450" x2="260" y2="250"/>
  <line x1="800" y1="450" x2="300" y2="680"/><line class="flow" x1="300" y1="680" x2="800" y2="450"/>
  <line x1="800" y1="450" x2="1330" y2="230"/><line class="flow" x1="1330" y1="230" x2="800" y2="450"/>
  <line x1="800" y1="450" x2="1300" y2="700"/><line class="flow" x1="800" y1="450" x2="1300" y2="700"/>
  <line x1="260" y1="250" x2="140" y2="120"/><line x1="300" y1="680" x2="150" y2="800"/>
  <line x1="1330" y1="230" x2="1490" y2="390"/><line x1="1300" y1="700" x2="1480" y2="800"/>
  <line x1="800" y1="450" x2="800" y2="840"/>
  <circle class="hub" cx="800" cy="450" r="16"/><circle class="pulse" cx="800" cy="450" r="16"/>
  <circle cx="260" cy="250" r="9"/><circle cx="300" cy="680" r="9"/><circle cx="1330" cy="230" r="9"/><circle cx="1300" cy="700" r="9"/>
  <circle cx="140" cy="120" r="6"/><circle cx="150" cy="800" r="6"/><circle cx="1490" cy="390" r="6"/><circle cx="1480" cy="800" r="6"/><circle cx="800" cy="840" r="7"/>
  <circle class="pulse" cx="1330" cy="230" r="9" style="animation-delay:1.1s"/><circle class="pulse" cx="300" cy="680" r="9" style="animation-delay:2s"/>
</svg>

<main>
  <form class="card" id="f" autocomplete="on" novalidate>
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V6z"/><path d="M8.5 12.5l2.4 2.4 4.8-5"/></svg></div>
    <h1><span class="name">NetSec-Agentic</span><span class="sub">Autonomous Security Operations Platform</span></h1>
    <div class="chips"><span>Live topology</span><span>AI security agent</span><span>Human-in-the-loop</span></div>

    <label for="u">Username</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </div>
    <label for="p">Password</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="eye" id="eye" title="Show password" aria-label="Show password">show</button>
    </div>
    <button class="go" id="go" type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
    <div class="foot">Authorized users only · activity is audited<br><b>Prisma SASE</b> · <b>Strata NGFW</b> · <b>Prisma AIRS</b> · <b>ELK</b></div>
  </form>
</main>

<script>
(function () {
  // only same-site relative targets are allowed after login (no open redirect)
  function target() {
    var n = new URLSearchParams(location.search).get('next') || '/';
    return (n.charAt(0) === '/' && n.charAt(1) !== '/' && n.indexOf('\\') < 0) ? n : '/';
  }
  // already signed in (or login disabled) → straight to the platform
  fetch('/auth/status', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (s) { if (s.authenticated) location.replace(target()); }).catch(function () {});

  var f = document.getElementById('f'), u = document.getElementById('u'), p = document.getElementById('p'),
      go = document.getElementById('go'), err = document.getElementById('err'), eye = document.getElementById('eye');
  eye.onclick = function () {
    var show = p.type === 'password'; p.type = show ? 'text' : 'password';
    eye.textContent = show ? 'hide' : 'show'; p.focus();
  };
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = '';
    if (!u.value || !p.value) { err.textContent = 'Enter your username and password.'; return; }
    go.disabled = true; go.textContent = 'Signing in…';
    fetch('/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ username: u.value.trim(), password: p.value })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok && j.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) { go.textContent = 'Welcome ✓'; location.replace(target()); return; }
        err.textContent = (res.j && res.j.error) || 'Sign-in failed.';
        f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
        p.select(); go.disabled = false; go.textContent = 'Sign in';
      })
      .catch(function () { err.textContent = 'Cannot reach the server. Check your connection.'; go.disabled = false; go.textContent = 'Sign in'; });
  });
})();
</script>
</body>
</html>
